name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.5]
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Run composer test
        run: composer test

  client-standalone:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.5]
        stability: [prefer-lowest, prefer-stable]

    name: client-standalone - P${{ matrix.php }} - ${{ matrix.stability }}

    defaults:
      run:
        working-directory: packages/trackto-client

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install the client on its own
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Fail if a framework crept into the client package
        run: |
          if composer show --name-only | grep -Eq '^(laravel|illuminate|orchestra)/'; then
            echo "::error::The client package must install without a framework."
            composer show --name-only | grep -E '^(laravel|illuminate|orchestra)/'
            exit 1
          fi

      - name: Run the client test suite
        run: vendor/bin/pest

      - name: Run the repo guards
        working-directory: ${{ github.workspace }}
        run: |
          php bin/check-package-deps
          php bin/check-package-archive
          sh bin/scan-secrets
