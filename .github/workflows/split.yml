name: Split Monorepo

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: trackto-client, path: packages/trackto-client, target: expertsystemsau/trackto-php-client }
          - { name: trackto-laravel, path: packages/trackto-laravel, target: expertsystemsau/trackto-laravel-client }
    concurrency:
      group: split-${{ matrix.package.name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Pinned to v4 on purpose (do NOT bump to match the other workflows).
      # splitsh-action@v1.0.0 runs `git config --local --unset-all
      # http.https://github.com/.extraheader` under `set -e`; checkout v5+ stores
      # the auth token via an includeIf credentials file instead of that inline
      # header, so the unset hits a missing key (exit 5) and aborts the split.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject malformed tags
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: php bin/check-tag "$TAG"

      - name: Split ${{ matrix.package.name }}
        uses: claudiodekker/splitsh-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_PAT }}
        with:
          prefix: ${{ matrix.package.path }}
          remote: https://github.com/${{ matrix.package.target }}.git
          reference: ${{ github.ref_name }}
          as_tag: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Create release on ${{ matrix.package.target }}
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.SPLIT_PAT }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.package.target }}
          MONO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$TARGET" >/dev/null 2>&1; then
            echo "Release $TAG already exists on $TARGET; leaving it untouched."
            exit 0
          fi
          # check-tag guarantees a "-" only introduces a pre-release part.
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" --repo "$TARGET" --verify-tag $pre --title "$TAG" \
            --notes "Release $TAG. Monorepo: https://github.com/$MONO/releases/tag/$TAG. Changelog: https://github.com/$MONO/blob/main/CHANGELOG.md"
